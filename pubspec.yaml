name: bausttrade
description: Campus Resale Marketplace for university students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Supabase
  supabase_flutter: ^2.3.0
  # State Management
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  # Functional Programming
  dartz: ^0.10.1
  # Equatable
  equatable: ^2.0.5
  # Image picker
  image_picker: ^1.0.4
  # UUID
  uuid: ^4.2.1
  # Cached network image
  cached_network_image: ^3.3.0
  # Intl
  intl: ^0.18.1
  # Path provider for file locations
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
